name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libltdl-dev libssl-dev build-essential \
            git zip unzip openjdk-17-jdk \
            ccache zlib1g-dev libncurses5-dev \
            libffi-dev libsqlite3-dev

      - name: Install Buildozer
        run: pip install buildozer "cython<3.0"

      - name: Build APK
        # yes | 自动应答 Android SDK 许可等所有交互确认
        # PIP_CONSTRAINT 强制 p4a 内部所有 pip 解析都用纯 Python 版依赖，
        # 绕开 charset-normalizer>=3.0 的 cp314 android wheel 不兼容问题
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetBlock-APK
          path: bin/*.apk
          retention-days: 30
